# Private Ollama for a later measured host. One CPU model. No public port.
# This file does not join the production desk network. That network was not
# observed from this workspace, so no bridge and no service DNS name is declared.
# The published port is host loopback only.
services:
  ollama:
    image: ollama/ollama:latest
    profiles: ["private-inference"]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: "2048"
      OLLAMA_KEEP_ALIVE: "10m"
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536M
volumes:
  ollama-models: