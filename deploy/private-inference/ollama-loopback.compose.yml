# Private Ollama on the existing host. One CPU model. No public port.
# Inside the Aureon Docker network the desk uses http://ollama:11434.
# 127.0.0.1 inside another container is that container, not this service.
# The published port is host loopback only, so 11434 is not a public port.
services:
  ollama:
    image: ollama/ollama:latest
    profiles: ["private-inference"]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: "2048"
      OLLAMA_KEEP_ALIVE: "10m"
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: "no"
    networks:
      - aureon_private
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2560M
networks:
  aureon_private:
    name: aureon_private
volumes:
  ollama-models:
