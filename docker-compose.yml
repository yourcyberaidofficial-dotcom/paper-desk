services:
  web:
    build:
      context: .
      args:
        AUREON_BUILD_COMMIT: ${AUREON_BUILD_COMMIT:-unknown}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Listen on every container interface. The process default is 127.0.0.1,
      # which Docker's published port cannot reach. The host mapping below
      # stays on loopback, so the desk is not published on a public interface.
      DESK_BIND: "0.0.0.0"
      PORT: "8080"
      # One web process. It must not start the desk, Telegram, or digest loops.
      AUREON_DISABLE_WORKERS: "1"
      AUREON_ROLE: web
      AUREON_DATA: /app/data
    command:
      - gunicorn
      - --workers
      - "1"
      - --threads
      - "1"
      - --bind
      - 0.0.0.0:8080
      - --timeout
      - "60"
      - ops.app:app
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - desk-data:/app/data/paper
      - desk-users:/app/data/users
      - desk-shadow:/app/data/shadow
      - desk-signals:/app/data/signals
      - desk-activity:/app/data/activity
      - desk-rights:/app/data/rights
      - desk-cache:/app/data/cache
      - desk-canonical:/app/data/canonical
      - desk-ai:/app/data/ai
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  worker:
    build:
      context: .
      args:
        AUREON_BUILD_COMMIT: ${AUREON_BUILD_COMMIT:-unknown}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AUREON_DISABLE_WORKERS: "1"
      AUREON_ROLE: worker
      AUREON_DATA: /app/data
    command: ["python", "-m", "ops.worker_main"]
    volumes:
      - desk-data:/app/data/paper
      - desk-users:/app/data/users
      - desk-shadow:/app/data/shadow
      - desk-signals:/app/data/signals
      - desk-activity:/app/data/activity
      - desk-rights:/app/data/rights
      - desk-cache:/app/data/cache
      - desk-canonical:/app/data/canonical
      - desk-ai:/app/data/ai
    healthcheck:
      test: ["CMD", "python", "-m", "ops.worker_status", "--check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
volumes:
  desk-data:
  desk-users:
  desk-shadow:
  desk-signals:
  desk-activity:
  desk-rights:
  desk-cache:
  desk-canonical:
  desk-ai:
