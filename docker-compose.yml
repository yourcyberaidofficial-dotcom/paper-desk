services:
  desk:
    build:
      context: .
      args:
        AUREON_BUILD_COMMIT: ${AUREON_BUILD_COMMIT:-unknown}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Listen on every container interface. The process default is 127.0.0.1,
      # which Docker's published port cannot reach. The host mapping below
      # stays on loopback, so the desk is not published on a public interface.
      DESK_BIND: "0.0.0.0"
      PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - desk-data:/app/data/paper
      - desk-users:/app/data/users
      - desk-shadow:/app/data/shadow
      - desk-signals:/app/data/signals
      - desk-activity:/app/data/activity
      - desk-rights:/app/data/rights
      - desk-cache:/app/data/cache
      - desk-canonical:/app/data/canonical
      - desk-ai:/app/data/ai
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  desk-data:
  desk-users:
  desk-shadow:
  desk-signals:
  desk-activity:
  desk-rights:
  desk-cache:
  desk-canonical:
  desk-ai:
