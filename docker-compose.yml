services:
  desk:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DESK_BIND: "0.0.0.0"
      PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - desk-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  desk-data:
